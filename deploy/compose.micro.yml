# Sobreposição temporária para a VM.Standard.E2.1.Micro (1 GB).
# Use somente junto de compose.yml e enquanto aguarda a Oracle A1.

services:
  db:
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    mem_limit: 224m

  migrate:
    mem_limit: 144m

  api:
    environment:
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "1"
      GUNICORN_TIMEOUT_SECONDS: "90"
    mem_limit: 144m

  worker:
    environment:
      # Mantém todos os timeframes, mas reduz a coleta aos pares mais líquidos.
      RSI_WORKER_INTERVALS: "${RSI_WORKER_INTERVALS:-5m,15m,30m,1h,4h,12h,1d,1w,1M}"
      RSI_WORKER_SYMBOLS: "${RSI_WORKER_SYMBOLS:-BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,TRX/USDT,AVAX/USDT,LINK/USDT}"
    mem_limit: 240m

  caddy:
    mem_limit: 48m
